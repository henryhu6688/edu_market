server:
  port: 8080
  mode: debug  # debug | release | test

database:
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""           # 用环境变量 DB_PASSWORD 覆盖
  dbname: edu_market
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100

redis:
  addr: 127.0.0.1:6379
  password: ""           # 用环境变量 REDIS_PASSWORD 覆盖
  db: 0

jwt:
  secret: ""             # 用环境变量 JWT_SECRET 覆盖（必填）
  expire_hours: 24
  access_ttl_minutes: 30
  refresh_ttl_hours: 24

ai:
  provider: deepseek
  api_key: ""            # 用环境变量 AI_API_KEY 覆盖（必填）
  api_url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-v4-pro

captcha:
  length: 6
  expire_seconds: 300
  resend_seconds: 60

agent:
  max_tool_rounds: 10
  context_max_messages: 20
  embedding_model: "BAAI/bge-m3"
  embedding_api_url: "https://api.siliconflow.cn/v1/embeddings"
  embedding_api_key: ""
  chunk_size: 500
  chunk_overlap: 50

rag:
  qdrant_url: "http://localhost:6335"
  qdrant_collection: "chunks"
  hybrid_search: true
  rerank: true
  rerank_topk: 5
  cleaner_enabled: true
  structural_chunk: true
  chunk_size: 500
  chunk_min: 300
  chunk_max: 800
  bm25_enabled: true
  cache_enabled: true
  cache_ttl: 3600
  cache_sim_threshold: 0.85
  cache_max_entries: 10

document:
  auto_save_delay: 2
  rag_sync: true
  max_upload_size: 20971520
  allowed_formats: [".pdf", ".docx", ".md", ".txt"]

upload:
  max_size: 10485760  # 10MB
  allowed_exts: [".jpg", ".jpeg", ".png", ".pdf", ".docx", ".zip"]
